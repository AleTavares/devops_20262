name: Avaliar PR de TF

# pull_request_target roda no contexto do repositorio BASE (a disciplina),
# entao tem acesso ao GITHUB_TOKEN e aos secrets, mesmo quando o PR vem de um fork.
# IMPORTANTE: nunca executamos codigo do fork aqui. O script apenas LE dados
# (via API do GitHub e da AWS) e comenta no PR. Nao ha checkout do codigo do PR.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Permissoes minimas: ler o PR e escrever comentarios.
permissions:
  pull-requests: write
  contents: read

jobs:
  avaliar:
    runs-on: ubuntu-latest
    # Environment protegido: os secrets AWS ficam vinculados a ele e a execucao
    # exige aprovacao do reviewer definido em Settings > Environments > bedrock.
    environment: bedrock
    steps:
      # Faz checkout apenas do repositorio BASE (a disciplina), no ref base.
      # Assim pegamos os criterios TF.md e o script, sem tocar no codigo do fork.
      - name: Checkout do repositorio base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      # Guarda de seguranca: se o PR tocar em arquivos sensiveis (.github/ ou
      # criterios TF.md), o job aborta ANTES de instalar deps ou usar secrets.
      # Alteracoes nesses arquivos devem passar por revisao sua (CODEOWNERS),
      # nunca ser processadas automaticamente por um PR de aluno.
      - name: Bloquear PR que altera arquivos sensiveis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          echo "Arquivos do PR:"; echo "$FILES"
          if echo "$FILES" | grep -E '^\.github/|/TF\.md$|^provas/' >/dev/null; then
            echo "::error::PR altera arquivos protegidos (.github/, TF.md ou provas/). Avaliacao automatica bloqueada; requer revisao manual de @AleTavares."
            exit 1
          fi

      # Regras exclusivas da PROVA: (1) apenas 1 PR por RA e (2) imutavel apos envio.
      # A prova e identificada pelo titulo. Se um aluno abrir um 2o PR de prova, ou
      # alterar (novos commits) um PR de prova ja aberto, o job aborta e sinaliza.
      - name: Regras de integridade da Prova (1 PR, imutavel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Detecta se este PR e da prova (titulo com "prova ... bimestre")
          if ! echo "$PR_TITLE" | grep -iqE 'prova.*bimestre|primeiro *bimestre|prova *primeiro *bi'; then
            echo "PR nao e da prova — regras de integridade nao se aplicam."
            exit 0
          fi
          echo "PR de PROVA detectado: #$PR_NUMBER ($PR_TITLE)"

          # Extrai o RA do titulo (RA: NNNN)
          RA=$(echo "$PR_TITLE" | grep -oiE 'RA[: ]+[0-9]{4,}' | grep -oE '[0-9]{4,}' | head -1 || true)
          echo "RA detectado: ${RA:-'(nao encontrado)'}"

          # Regra 2 — imutavel apos envio: novos commits (synchronize) sao proibidos
          if [ "$PR_ACTION" = "synchronize" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
              "⛔ **Prova imutável após o envio.** Este PR recebeu novos commits depois de aberto. A entrega da prova **não pode ser alterada** após o envio. Serão considerados apenas os commits presentes no momento da abertura do PR. Alterações posteriores serão desconsideradas na avaliação." || true
            echo "::error::PR de prova alterado apos o envio (synchronize). Alteracao nao permitida."
            exit 1
          fi

          # Regra 1 — apenas 1 PR de prova por RA
          if [ -n "${RA:-}" ]; then
            # Lista todos os PRs (abertos e fechados) e conta os de prova com o mesmo RA
            OUTROS=$(gh pr list --repo "$REPO" --state all --limit 500 \
              --json number,title \
              --jq "[.[] | select(.title | test(\"prova.*bimestre|primeiro *bimestre\"; \"i\")) | select(.title | test(\"$RA\")) | .number] | map(select(. != $PR_NUMBER)) | .[]" || true)
            if [ -n "$OUTROS" ]; then
              echo "PRs de prova pre-existentes para o RA $RA: $OUTROS"
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
                "⛔ **Apenas um PR de prova por aluno.** Já existe um Pull Request de prova para o RA **$RA** (PR(s): $(echo $OUTROS | tr '\n' ' ')). Este PR duplicado será desconsiderado. Se precisar corrigir a entrega, fale com o professor — a prova permite **apenas uma submissão**." || true
              echo "::error::Ja existe PR de prova para o RA $RA. Somente 1 PR e permitido."
              exit 1
            fi
          else
            echo "::warning::Nao foi possivel extrair o RA do titulo; regra de PR unico nao aplicada. Use o formato '[Prova Primeiro Bimestre] RA: NNNN - Nome'."
          fi

          echo "Regras de integridade da prova OK: PR unico e sem alteracao pos-envio."

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r .github/scripts/requirements.txt

      - name: Avaliar PR e comentar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Bedrock / AWS
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_SESSION_TOKEN nao e usado: o usuario automacaotf tem chave permanente (AKIA).
          # Se um dia usar credencial temporaria (STS), adicione aqui o secret correspondente.
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          # us-east-2 exige inference profile (prefixo "us."); ID direto nao e invocavel on-demand.
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID || 'us.anthropic.claude-haiku-4-5-20251001-v1:0' }}
          # Liga/desliga a analise por IA. Se "false", roda so o pre-check deterministico.
          USE_BEDROCK: ${{ vars.USE_BEDROCK || 'true' }}
        run: python .github/scripts/avaliar_pr.py
